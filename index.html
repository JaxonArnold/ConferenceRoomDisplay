<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Room Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0c0f14;
      --text-primary: #f0ede8;
      --text-secondary: rgba(240, 237, 232, 0.5);
      --divider: rgba(255, 255, 255, 0.07);
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.12);
    }

    body.studio {
      --accent: #c9a96e;
      --accent-glow: rgba(201, 169, 110, 0.12);
      --ambient-1: rgba(201, 169, 110, 0.04);
      --ambient-2: rgba(180, 140, 80, 0.025);
    }

    body.winners {
      --accent: #7eaaa2;
      --accent-glow: rgba(126, 170, 162, 0.12);
      --ambient-1: rgba(126, 170, 162, 0.04);
      --ambient-2: rgba(100, 150, 140, 0.025);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 30% 90%, var(--ambient-1), transparent),
        radial-gradient(ellipse 70% 60% at 75% 15%, var(--ambient-2), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 3vh 4vw;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2.5vh;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .logo-area img {
      height: 5vh;
      min-height: 36px;
      max-height: 64px;
      width: auto;
      object-fit: contain;
      filter: brightness(1.05);
    }

    .room-name {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: clamp(0.7rem, 1.1vw, 0.95rem);
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--accent);
    }

    .header-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
    }

    .clock {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(1.2rem, 2.5vw, 2.2rem);
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .date-display {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(0.65rem, 1vw, 0.85rem);
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3.5vh;
      padding: 2vh 2vw;
    }

    .idle-state {
      text-align: center;
      animation: fadeIn 1s ease;
    }

    .idle-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4vw, 3.5rem);
      font-weight: 400;
      font-style: italic;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    .meeting-display {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3vh;
      animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .welcome-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 2.8vw, 2.6rem);
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .client-names {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.5rem, 9vw, 9rem);
      font-weight: 600;
      line-height: 1.05;
      color: var(--text-primary);
      letter-spacing: -0.015em;
      max-width: 90vw;
    }

    .accent-rule {
      width: clamp(40px, 5vw, 80px);
      height: 2px;
      background: var(--accent);
      border: none;
      border-radius: 1px;
      opacity: 0.6;
    }

    .meeting-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-top: 1vh;
    }

    .meeting-time {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(0.9rem, 1.5vw, 1.3rem);
      color: var(--text-secondary);
    }

    .time-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .time-dot.live {
      animation: pulse 2s ease-in-out infinite;
    }

    .meta-divider {
      width: 1px;
      height: 1.2em;
      background: var(--divider);
    }

    .status-badge {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: clamp(0.6rem, 0.9vw, 0.8rem);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 0.45em 1.3em;
      border-radius: 100px;
      color: var(--accent);
      border: 1px solid var(--accent-glow);
      background: var(--accent-glow);
    }

    .next-up {
      margin-top: 1vh;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(0.75rem, 1.1vw, 0.95rem);
      color: var(--text-secondary);
      opacity: 0.6;
      letter-spacing: 0.03em;
    }

    .next-up span {
      color: var(--text-primary);
      opacity: 0.8;
    }

    footer {
      flex-shrink: 0;
      padding-top: 2vh;
      border-top: 1px solid var(--divider);
      min-height: 2.5vh;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .room-toggle {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(0.6rem, 0.85vw, 0.75rem);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-secondary);
      background: var(--bg-card, rgba(255, 255, 255, 0.04));
      border: 1px solid var(--divider);
      border-radius: 100px;
      padding: 0.5em 1.4em;
      cursor: pointer;
      transition: color 0.25s, border-color 0.25s, background 0.25s;
      opacity: 0.6;
    }

    .room-toggle:hover {
      color: var(--accent);
      border-color: var(--accent-glow);
      background: var(--accent-glow);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.5); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-area">
        <img src="/logo.png" alt="Company Logo" onerror="this.style.display='none'">
        <span class="room-name" id="room-name"></span>
      </div>
      <div class="header-right">
        <div class="clock" id="clock"></div>
        <div class="date-display" id="date-display"></div>
      </div>
    </header>

    <main id="main-content">
      <div class="idle-state">
        <p class="idle-tagline">No upcoming meetings</p>
      </div>
    </main>

    <footer>
      <button class="room-toggle" id="room-toggle"></button>
    </footer>
  </div>

  <script>
    // ── Determine which room this display is for ──
    // Usage: ?room=large (Studio Room) or ?room=small (Winner's Circle)
    const params = new URLSearchParams(window.location.search);
    const roomParam = (params.get('room') || 'large').toLowerCase();
    const isStudio = roomParam === 'large' || roomParam === 'studio';
    const roomFilter = isStudio ? 'Large' : 'Small';
    const roomDisplayName = isStudio ? 'Studio Room' : "Winner\u2019s Circle";

    document.body.classList.add(isStudio ? 'studio' : 'winners');
    document.getElementById('room-name').textContent = roomDisplayName;
    document.title = roomDisplayName;

    // ── Room toggle button ──
    const toggleBtn = document.getElementById('room-toggle');
    const otherRoom = isStudio ? 'small' : 'large';
    const otherRoomName = isStudio ? "Winner\u2019s Circle" : 'Studio Room';
    toggleBtn.textContent = 'View ' + otherRoomName;
    toggleBtn.addEventListener('click', function() {
      const url = new URL(window.location);
      url.searchParams.set('room', otherRoom);
      window.location.href = url.toString();
    });

    // ── Clock & Date ──
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
      });
      document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });
    }
    updateClock();
    setInterval(updateClock, 10000);

    // ── Helpers ──
    // Contact names come from Daylite; escape them before building HTML
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function formatNames(names) {
      names = (names || []).map(escapeHtml);
      if (!names || names.length === 0) return 'Guest';
      if (names.length === 1) return names[0];
      if (names.length === 2) return names[0] + ' & ' + names[1];
      if (names.length <= 4) return names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1];
      return names.slice(0, 3).join(', ') + ' & others';
    }

    function statusText(appt) {
      if (appt.status === 'in-progress') return 'In Progress';
      if (appt.minutesUntilStart <= 1) return 'Starting Now';
      return 'In ' + appt.minutesUntilStart + ' min';
    }

    // ── Render ──
    function renderMeetings(appointments) {
      const main = document.getElementById('main-content');
      const roomAppts = appointments.filter(a => a.room === roomFilter);

      if (roomAppts.length === 0) {
        main.innerHTML =
          '<div class="idle-state" style="animation: fadeIn 0.6s ease both;">' +
            '<p class="idle-tagline">No upcoming meetings</p>' +
          '</div>';
        return;
      }

      // In-progress first, then soonest
      roomAppts.sort((a, b) => {
        if (a.status === 'in-progress' && b.status !== 'in-progress') return -1;
        if (b.status === 'in-progress' && a.status !== 'in-progress') return 1;
        return a.minutesUntilStart - b.minutesUntilStart;
      });

      const primary = roomAppts[0];
      const isLive = primary.status === 'in-progress';
      const names = formatNames(primary.names);

      let nextUpHTML = '';
      if (roomAppts.length > 1) {
        const next = roomAppts[1];
        nextUpHTML =
          '<div class="next-up">Up next at ' + escapeHtml(next.formattedStartTime) +
          ' &middot; <span>' + formatNames(next.names) + '</span></div>';
      }

      main.innerHTML =
        '<div class="meeting-display">' +
          '<span class="welcome-label">Welcome</span>' +
          '<hr class="accent-rule">' +
          '<div class="client-names">' + names + '</div>' +
          '<div class="meeting-meta">' +
            '<div class="meeting-time">' +
              '<span class="time-dot ' + (isLive ? 'live' : '') + '"></span>' +
              escapeHtml(primary.formattedStartTime) + ' \u2013 ' + escapeHtml(primary.formattedEndTime) +
            '</div>' +
            '<span class="meta-divider"></span>' +
            '<span class="status-badge">' + statusText(primary) + '</span>' +
          '</div>' +
          nextUpHTML +
        '</div>';
    }

    // ── Polling ──
    let lastJson = '';
    let lastSuccess = Date.now();
    // If the server can't be reached for this long, stop showing a meeting
    // that may already be over
    const STALE_AFTER_MS = 3 * 60 * 1000;

    async function fetchAppointments() {
      try {
        const res = await fetch('/api/appointments');
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        lastSuccess = Date.now();
        const json = JSON.stringify(data);
        if (json !== lastJson) {
          lastJson = json;
          renderMeetings(data);
        }
      } catch (err) {
        console.error('Error fetching appointments:', err);
        if (Date.now() - lastSuccess > STALE_AFTER_MS && lastJson !== '[]') {
          lastJson = '[]';
          renderMeetings([]);
        }
      }
    }

    fetchAppointments();
    setInterval(fetchAppointments, 30000);
  </script>
</body>
</html>
